# ============================================================================
# Nav2 params — ROS 2 Humble — MPPI controller, SmacPlanner2D, diff-drive
# Tuned for: 0.61 m x 0.46 m rectangular robot, 0.8 m/s, indoor tight spaces,
# forward-only, dynamic obstacle avoidance, static map loaded from map_server.
#
# Migration notes from the previous RPP config:
#   * Controller: RegulatedPurePursuitController -> MPPIController
#   * Planner:    NavfnPlanner -> SmacPlanner2D (cleaner paths, fewer corner kinks)
#   * Inflation:  0.40 m (tripped RPP) -> 0.55 m (MPPI wants wider, softer field)
#   * Added:      smoother_server (SimpleSmoother), velocity_smoother activated
#   * Fixed:      expected_planner_frequency -> 1.0, dead FollowPathOld removed,
#                 behavior_server "backup" key, recovery_alpha_slow/fast on AMCL
# ============================================================================

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0          # matches your 12 m laser
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # Kidnap recovery: alpha_slow/alpha_fast ratio triggers random-pose injection
    # when short-term avg likelihood drops below long-term avg -> relocalizes.
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.2       # user's tuned value, kept
    update_min_a: 0.2
    update_min_d: 0.25
    # Sensor mixture weights must sum to 1.0 (user's tuned values)
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.4
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 25.449546813964844
      y: 2.206489324569702
      z: 0.0
      yaw: 0.0655

# ============================================================================
# Behavior tree navigator
# ============================================================================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # wait_for_service_timeout in ms; Humble default 1000 is fine.
    enable_groot_monitoring: false
    # Default trees shipped with nav2_bt_navigator; override if you maintain
    # a custom tree XML.
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node   # kept per user request
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node            # kept per user request
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# ============================================================================
# Controller server — MPPI
# ============================================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    # 20 Hz is the safe default on modest CPUs (incl. ARM) with batch_size 2000.
    # Raise to 30 Hz (and set model_dt: 0.033) if you have Intel i5+ headroom.
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"    # Humble: SINGULAR
    goal_checker_plugins: ["goal_checker"]         # Humble: PLURAL
    controller_plugins: ["FollowPath"]

    progress_checker:
      # PoseProgressChecker counts in-place rotation as progress, which matters
      # for a forward-only diff-drive doing final yaw alignment at the goal.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.25
      required_movement_angle: 0.25
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20     # MPPI stochastic dither ~0.1 m; 0.20 avoids latch issues
      yaw_goal_tolerance: 0.20    # ~11.5 deg
      stateful: True

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # ---------- Sampling / horizon ----------
      # Prediction horizon = time_steps * model_dt = 56 * 0.05 = 2.8 s
      # At vx_max 0.8 m/s, projected reach = 2.24 m. Local costmap half-width
      # must exceed this -> 5x5 m costmap below.
      time_steps: 56
      model_dt: 0.05              # == 1 / controller_frequency; controller logs a
                                  # warning if model_dt > 1/freq. Keep them matched.
      batch_size: 2000            # 1000@50Hz or 2000@30Hz are Nav2 sweet spots;
                                  # 2000@20Hz is comfortable. Drop to 1000 on ARM.
      iteration_count: 1          # Recommended 1; prefer bigger batches over more iters.

      # ---------- Velocity / noise envelope (DiffDrive, forward-only) ----------
      vx_std: 0.2
      vy_std: 0.0                 # DiffDrive has no lateral motion
      wz_std: 0.4                 # generous: pivot-in-place is our escape since vx_min=0
      vx_max: 0.8
      vx_min: 0.0                 # HARD forward-only constraint (samples clipped at source)
      vy_max: 0.0
      wz_max: 1.9                 # generous so robot can spin to escape in tight spots

      # NOTE: ax_max / ax_min / ay_max / az_max are NOT available on most Humble
      # builds (PR #4352 was Iron/Jazzy only; Issue #5020 confirms absence at
      # 1.1.16). They are intentionally OMITTED here. If you rely on accel
      # smoothing, use the velocity_smoother block at the bottom of this file.

      # ---------- Softmax weighting ----------
      temperature: 0.3            # 0 = greedy, large = mean-of-all. 0.3 is default.
      gamma: 0.015                # smoothness-vs-energy trade; Humble code default.

      # ---------- Path handling ----------
      # prune_distance must be <= local_costmap half-width (2.5 m here).
      prune_distance: 2.0
      transform_tolerance: 0.1
      max_robot_pose_search_dist: 10.0
      enforce_path_inversion: false       # no path inversion for forward-only

      # ---------- Motion model ----------
      motion_model: "DiffDrive"   # DiffDrive / Omni / Ackermann

      # ---------- Misc ----------
      visualize: false            # set true briefly for rviz debug; ~halves throughput
      reset_period: 1.0           # HUMBLE-ONLY: forces optimizer reset after 1 s idle.
                                  # Do NOT remove -- stale state causes bad first commands.
      regenerate_noises: false    # single fixed noise distribution = less jitter

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # AckermannConstraints block omitted — not DiffDrive-relevant.

      # ---------- Critics (order is cosmetic; weights do the work) ----------
      # TwirlingCritic OMITTED (harmful for diff-drive — penalizes cornering).
      # ObstaclesCritic OMITTED (we use CostCritic — the post-Oct-2023 default).
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0          # keeps softmax mean inside vx/wz envelope

      CostCritic:
        # Uses the local costmap inflation layer directly. Unlike ObstaclesCritic,
        # it does NOT duplicate inflation_radius/cost_scaling_factor on Humble —
        # it reads them from inflation_layer_name (default: last inflation layer).
        enabled: true
        cost_power: 1
        cost_weight: 4.0                 # slightly above 3.81 default for tight spaces
        critical_cost: 300.0             # applied when any trajectory pose is in inflation
        consider_footprint: true         # USE FOOTPRINT — you are non-circular and tight
        collision_cost: 1000000.0
        near_goal_distance: 0.4          # drop preferential obstacle term near goal
        # inflation_layer_name: "inflation_layer"  # optional if you have multiple

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        # Ideally ~= prediction horizon distance (2.24 m). 1.4 default still works
        # at 0.8 m/s because the last ~1.4 m is where goal-seeking should dominate.
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        # Must be >= xy_goal_tolerance so yaw critic fires before xy latches.
        threshold_to_consider: 0.5

      PreferForwardCritic:
        # Belt-and-suspenders with vx_min=0: harmless (no reverse samples exist
        # when vx_min=0), but catches any future regression. Soft constraint.
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        # Higher cost_weight = tighter lane-keeping through doorways.
        # max_path_occupancy_ratio is the key knob for dynamic obstacle avoidance:
        # when >5% of the local path is in collision, this critic self-disables
        # so CostCritic can steer the robot around the obstacle.
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20         # raise to 30-50 if you see wiper-oscillation
        use_path_orientations: false     # only true with SmacHybrid (feasible paths)

      PathFollowCritic:
        # Drives forward progress along the path. Too low -> robot stalls;
        # too high -> cuts corners into obstacles.
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        # Pivots the robot to face upcoming path segments on sharp turns.
        # forward_preference=true is CRITICAL for forward-only operation.
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0       # ~57 deg — fire earlier for tight turns
        forward_preference: true
        # NOTE: PathAngleCritic.mode does NOT exist on Humble (Jazzy-only).

# ============================================================================
# Local costmap — MPPI rolling window
# ============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # Size must be >= 2 * (time_steps * model_dt * vx_max) + footprint.
      # 2 * 2.24 + 0.61 ~= 5.1 m -> use 5.0.
      width: 5
      height: 5
      resolution: 0.05
      track_unknown_space: false      # rolling odom-frame window, no unknowns
      # EXACT user footprint kept:
      footprint: "[[0.3044, 0.2286], [0.3044, -0.2286], [-0.3094, -0.2286], [-0.3094, 0.2286]]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        footprint_clearing_enabled: true
        scan:
          topic: /scan
          sensor_frame: ""
          data_type: "LaserScan"
          obstacle_max_range: 8.0      # mark closer than full 12 m -> less noise
          raytrace_max_range: 10.0     # must be >= obstacle_max_range to clear
          obstacle_min_range: 0.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # 0.55 m is WIDER than the old RPP 0.40 on purpose. RPP tripped because
        # 0.40 was pinched against your 0.38 m circumscribed radius, leaving no
        # inscribed band — any laser noise looked lethal. MPPI's CostCritic
        # wants a smooth, wide gradient; 0.55 + cost_scaling 2.5 gives exactly
        # that without squeezing doorways (your 0.46 m width passes a 0.72 m
        # doorway with room).
        inflation_radius: 0.55
        cost_scaling_factor: 2.5
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: true

# ============================================================================
# Global costmap
# ============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      track_unknown_space: true        # for planner allow_unknown logic
      resolution: 0.05
      # EXACT user footprint kept:
      footprint: "[[0.3044, 0.2286], [0.3044, -0.2286], [-0.3094, -0.2286], [-0.3094, 0.2286]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        footprint_clearing_enabled: true
        scan:
          topic: /scan
          data_type: "LaserScan"
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0
          obstacle_min_range: 0.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Mirror local costmap for consistency.
        inflation_radius: 0.55
        cost_scaling_factor: 2.5
      always_send_full_costmap: true

# ============================================================================
# Map server
# ============================================================================
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/agi/Desktop/SAGE_ROBOT/maps/new_save_map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# ============================================================================
# Planner — SmacPlanner2D (upgrade from NavfnPlanner)
# SmacPlanner2D is cost-aware 8-connected A* for diff/omni robots, producing
# cleaner corner behavior than NavFn's gradient wavefront — MPPI's PathAlign
# critic works much better on its output.
# ============================================================================
planner_server:
  ros__parameters:
    use_sim_time: false
    # Lowered from the old NavfnPlanner value to match MPPI's 20 Hz reality.
    # Planner does NOT run at controller freq; it runs on demand via BT.
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false            # static map, stay out of unknown
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: "MOORE"
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false   # let MPPI handle final orientation
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

# ============================================================================
# Smoother server — light SimpleSmoother for cleaner PathAlign behavior.
# SmacPlanner2D already smooths internally, but a second-stage polish helps.
# ============================================================================
smoother_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    transform_tolerance: 0.1
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
      refinement_num: 2

# ============================================================================
# Behavior server — spin, backup, wait, drive_on_heading, assisted_teleop.
# NOTE: behavior name is "backup" in the server but the plugin class is BackUp.
# The BT XML references <BackUp> action — server name must match the server
# action under /backup. We keep key "backup" so action server is /backup.
# ============================================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ============================================================================
# Waypoint follower
# ============================================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# ============================================================================
# Velocity smoother — ACTIVATED (was commented out before).
# Substitutes for the missing ax_max/az_max on Humble MPPI: caps acceleration
# at the cmd_vel stage so tight-space pivots don't request impossible jerks.
# Topic /cmd_vel_smoothed should be wired to your motor driver (or remap this
# server's output to /cmd_vel and have MPPI publish to /cmd_vel_raw).
# ============================================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.0, 1.9]       # [vx, vy, wz] — matches MPPI envelope
    min_velocity: [0.0, 0.0, -1.9]      # forward-only -> vx_min = 0.0
    max_accel: [1.5, 0.0, 3.2]          # gentle forward accel for tight spaces
    max_decel: [-2.0, 0.0, -3.2]        # stronger decel = safer stops
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ============================================================================
# Lifecycle manager — include smoother_server (new) and velocity_smoother (new)
# ============================================================================
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - amcl
