services:
  web:
    build: .
    container_name: django_kb
    ports:
      - 8004:8004
    volumes:
      - ./SAGE_KB:/app
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env
      
  db:
    image: pgvector/pgvector:pg17
    container_name: postgres_db_sage
    volumes:
      - ./postgres_db:/var/lib/postgresql/data/
      - ./postgres_db_init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
